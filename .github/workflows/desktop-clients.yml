name: Desktop clients

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }} (${{ matrix.pack_platform }}/${{ matrix.pack_arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            pack_platform: darwin
            pack_arch: arm64
          - os: windows-latest
            pack_platform: win32
            pack_arch: x64
          - os: ubuntu-latest
            pack_platform: linux
            pack_arch: x64
    steps:
      - name: Require CODEFERRY_SOURCE_TOKEN
        shell: bash
        env:
          CODEFERRY_SOURCE_TOKEN: ${{ secrets.CODEFERRY_SOURCE_TOKEN }}
        run: |
          if [ -z "${CODEFERRY_SOURCE_TOKEN}" ]; then
            echo "::error::MISSING_CODEFERRY_SOURCE_TOKEN"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: crazylin/codeferry
          ref: main
          token: ${{ secrets.CODEFERRY_SOURCE_TOKEN }}
          path: source
          persist-credentials: false

      - name: Setup Rust 1.96.0
        uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
        with:
          toolchain: 1.96.0

      - name: Setup Node.js 22.13.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.x

      - name: Clone WebCodex and apply the baseline patch
        shell: bash
        run: |
          set -euo pipefail
          git -C source config core.autocrlf false
          git -C source checkout --force HEAD
          if grep -q $'\r' source/upstream/remotemcp.patch; then
            echo "::error::PATCH_HAS_CRLF"
            exit 1
          fi
          commit="$(node -e 'const b=require("./source/upstream/baseline.json"); if(!/^[a-f0-9]{40}$/.test(b.commit)||b.ref!=="v"+b.version||b.repository!=="https://github.com/yyjeqhc/webcodex.git"){console.error("INVALID_BASELINE"); process.exit(1)} process.stdout.write(b.commit)')"
          git -c core.autocrlf=false clone -c core.autocrlf=false -c core.eol=lf --branch v0.4.5 --depth 1 https://github.com/yyjeqhc/webcodex.git source/upstream/webcodex
          test "$(git -C source/upstream/webcodex rev-parse HEAD)" = "${commit}"
          test "$(git -C source/upstream/webcodex rev-parse 'v0.4.5^{commit}')" = "${commit}"
          git -C source/upstream/webcodex apply --check "${GITHUB_WORKSPACE}/source/upstream/remotemcp.patch"
          git -C source/upstream/webcodex apply "${GITHUB_WORKSPACE}/source/upstream/remotemcp.patch"
          test -f source/upstream/webcodex/LICENSE

      - name: Build the host Runner
        shell: bash
        env:
          PACK_PLATFORM: ${{ matrix.pack_platform }}
          PACK_ARCH: ${{ matrix.pack_arch }}
        run: |
          set -euo pipefail
          host="$(rustc -vV | awk '/^host: /{print $2}')"
          case "${PACK_PLATFORM}:${PACK_ARCH}:${host}" in
            darwin:arm64:aarch64-apple-darwin) ;;
            linux:x64:x86_64-unknown-linux-gnu) ;;
            win32:x64:x86_64-pc-windows-msvc) ;;
            *) echo "::error::RUST_HOST_MISMATCH ${host}"; exit 1 ;;
          esac
          upstream="source/upstream/webcodex"
          revision="$(git -C "${upstream}" rev-parse HEAD)"
          if [ -n "$(git -C "${upstream}" status --porcelain --untracked-files=all)" ]; then
            dirty=true
          else
            dirty=false
          fi
          while IFS= read -r name; do
            case "${name}" in
              WEBCODEX_GIT_*|WEBCODEX_BUILD_*) unset "${name}" || true ;;
            esac
          done < <(env | awk -F= '{print $1}')
          unset WEBCODEX_BUILT_AT SOURCE_DATE_EPOCH || true
          export WEBCODEX_GIT_COMMIT="${revision}"
          export WEBCODEX_GIT_DIRTY="${dirty}"
          # Server identity is recorded in BUILD_INFO. The Runner is installed as
          # codeferry-runner. The desktop does not package the WebCodex CLI.
          cargo build --manifest-path "${upstream}/Cargo.toml" --locked --profile dogfood \
            -p webcodex -p webcodex-runner \
            --bin webcodex-server --bin webcodex-runner

      - name: Write the host runtime
        shell: bash
        env:
          PACK_PLATFORM: ${{ matrix.pack_platform }}
          PACK_ARCH: ${{ matrix.pack_arch }}
        run: |
          set -euo pipefail
          node .github/scripts/stage-desktop-runtime.mjs \
            --source source \
            --upstream source/upstream/webcodex \
            --platform "${PACK_PLATFORM}" \
            --arch "${PACK_ARCH}" \
            --stage "${RUNNER_TEMP}/desktop-runtime"

      - name: Install locked desktop dependencies
        working-directory: source/desktop
        run: |
          npm ci
          node node_modules/electron/install.js

      - name: Package desktop client
        working-directory: source/desktop
        env:
          CODEFERRY_PACK_PLATFORM: ${{ matrix.pack_platform }}
          CODEFERRY_PACK_ARCH: ${{ matrix.pack_arch }}
        run: npm run package

      - name: Pack a single archive
        shell: bash
        env:
          PACK_PLATFORM: ${{ matrix.pack_platform }}
          PACK_ARCH: ${{ matrix.pack_arch }}
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          archive="CodeFerry-${PACK_PLATFORM}-${PACK_ARCH}-${tag}.tar.gz"
          tar -C source/artifacts -czf "${archive}" .
          test -s "${archive}"

      - name: Upload archive
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CODEFERRY_SOURCE_TOKEN }}
          PACK_PLATFORM: ${{ matrix.pack_platform }}
          PACK_ARCH: ${{ matrix.pack_arch }}
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          archive="CodeFerry-${PACK_PLATFORM}-${PACK_ARCH}-${tag}.tar.gz"
          bash .github/scripts/publish-private-asset.sh "${tag}" "${archive}"

  gateway:
    name: Gateway image (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Require CODEFERRY_SOURCE_TOKEN
        shell: bash
        env:
          CODEFERRY_SOURCE_TOKEN: ${{ secrets.CODEFERRY_SOURCE_TOKEN }}
        run: |
          if [ -z "${CODEFERRY_SOURCE_TOKEN}" ]; then
            echo "::error::MISSING_CODEFERRY_SOURCE_TOKEN"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: crazylin/codeferry
          ref: main
          token: ${{ secrets.CODEFERRY_SOURCE_TOKEN }}
          path: source
          persist-credentials: false

      - name: Setup Rust 1.96.0
        uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
        with:
          toolchain: 1.96.0

      - name: Build the gateway and native Server
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path source/gateway-rs/Cargo.toml --release --locked
          commit="$(python3 -c 'import json; print(json.load(open("source/upstream/baseline.json"))["commit"])')"
          git clone --branch v0.4.5 --depth 1 https://github.com/yyjeqhc/webcodex.git native
          test "$(git -C native rev-parse HEAD)" = "${commit}"
          git -C native apply "${GITHUB_WORKSPACE}/source/upstream/remotemcp.patch"
          cargo build --manifest-path native/Cargo.toml --locked --profile dogfood --bin webcodex-server -p webcodex

      - name: Build the runtime image
        shell: bash
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          context="${RUNNER_TEMP}/gateway-image"
          mkdir -p "${context}/runtime/public"
          cp source/gateway-rs/target/release/codeferry-gateway "${context}/runtime/codeferry-gateway"
          cp native/target/dogfood/webcodex-server "${context}/runtime/webcodex-server"
          cp -a source/public/. "${context}/runtime/public/"
          cp source/deploy/1panel/Dockerfile "${context}/Dockerfile"
          cp /etc/ssl/certs/ca-certificates.crt "${context}/ca-certificates.crt"
          docker build -t "codeferry-gateway:${tag}" "${context}"
          docker save "codeferry-gateway:${tag}" | gzip -1 > "codeferry-gateway-${tag}.tar.gz"
          test -s "codeferry-gateway-${tag}.tar.gz"

      - name: Upload image
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CODEFERRY_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash .github/scripts/publish-private-asset.sh "${tag}" "codeferry-gateway-${tag}.tar.gz"
