name: Private desktop preflight

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact private source commit to compile without publishing
        required: true
        type: string

      platform:
        description: Desktop platform or backend services to diagnose without publishing
        required: true
        default: all
        type: choice
        options: [all, win32, backend]

permissions:
  contents: read
concurrency:
  group: codeferry-desktop-preflight
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  preflight:
    name: Compile and diagnose ${{ matrix.platform }} ${{ matrix.arch }}
    if: inputs.platform != 'backend'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'win32' && '[{"os":"windows-2025","platform":"win32","arch":"x64"}]' || '[{"os":"macos-15","platform":"darwin","arch":"arm64"},{"os":"windows-2025","platform":"win32","arch":"x64"},{"os":"ubuntu-24.04","platform":"linux","arch":"x64"}]') }}
    env:
      SOURCE_SHA: ${{ inputs.source_commit }}
    steps:
      - name: Validate exact source commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'SOURCE_COMMIT_MUST_BE_EXACT_SHA'; exit 1; }
          git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: crazylin/codeferry
          ref: ${{ inputs.source_commit }}
          token: ${{ secrets.CODEFERRY_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            source/desktop-tauri/package-lock.json
      - name: Validate private Windows diagnostic identity and redaction
        if: runner.os == 'Windows'
        run: node --test .github/scripts/tests/windows-diagnostics.test.mjs .github/scripts/tests/private-diagnostics.test.mjs
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
        with: {toolchain: '1.96.0', components: rustfmt}
      - name: Prepare and reproduce reviewed native source
        run: node .github/scripts/ci-task.mjs native-source node .github/scripts/prepare-source.mjs
      - name: Restore private desktop Rust dependencies
        env: {GH_TOKEN: '${{ secrets.CODEFERRY_SOURCE_TOKEN }}'}
        run: node .github/scripts/private-cache.mjs restore desktop-${{ matrix.platform }}-${{ matrix.arch }}
      - name: Build and verify the exact native Runner without packaging
        working-directory: source
        env: {CODEFERRY_NATIVE_PROFILE: 'release'}
        run: node ../.github/scripts/ci-task.mjs native-runtime node scripts/native-build.mjs
      - name: Install Linux native WebView build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev
      - name: Install locked frontend dependencies
        working-directory: source/desktop-tauri
        run: node ../../.github/scripts/ci-task.mjs tauri-dependencies npm ci
      - name: Build frontend and compile complete Rust client tests
        shell: bash
        working-directory: source/desktop-tauri
        run: |
          set -euo pipefail
          node ../../.github/scripts/ci-task.mjs tauri-types npm run typecheck
          node ../../.github/scripts/ci-task.mjs tauri-frontend-build npm run build
          node ../../.github/scripts/ci-task.mjs tauri-contracts cargo test --manifest-path src-tauri/Cargo.toml --locked --no-run
          node ../../.github/scripts/ci-task.mjs tauri-contracts cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Exercise the rebuilt shared Runner and require actual tests to execute
        run: node .github/scripts/ci-task.mjs tauri-native-runner node .github/scripts/native-runner-acceptance.mjs
      - name: Test macOS native browser isolation and management IPC
        if: runner.os == 'macOS'
        working-directory: source/desktop-tauri
        run: node ../../.github/scripts/ci-task.mjs tauri-native-browser npm run test:browser
      - name: Retain bounded pre-signing failure diagnostics privately
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.CODEFERRY_SOURCE_TOKEN }}
          CODEFERRY_DIAGNOSTIC_ROLE: ${{ matrix.platform }}-${{ matrix.arch }}
        run: node .github/scripts/save-private-diagnostics.mjs
      - name: Save reusable dependencies privately even after a failed preflight
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.CODEFERRY_SOURCE_TOKEN }}
          CODEFERRY_CACHE_COMPLETE: 'false'
        run: node .github/scripts/private-cache.mjs save desktop-${{ matrix.platform }}-${{ matrix.arch }}

  backend:
    name: Real isolated PostgreSQL and Redis acceptance
    if: inputs.platform == 'backend'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ inputs.source_commit }}
      TEST_DATABASE_URL: postgres://codeferry:fixture-ci-password@127.0.0.1:5432/codeferry_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      RUSTUP_TOOLCHAIN: '1.96.0'
    # Each job owns disposable services. No production database, Redis endpoint,
    # bootstrap token, signing key or publication credential enters this lane.
    services:
      postgres:
        image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: codeferry
          POSTGRES_PASSWORD: fixture-ci-password
          POSTGRES_DB: codeferry_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U codeferry -d codeferry_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Validate exact backend source commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'SOURCE_COMMIT_MUST_BE_EXACT_SHA'; exit 1; }
          git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: crazylin/codeferry
          ref: ${{ inputs.source_commit }}
          token: ${{ secrets.CODEFERRY_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
      - name: Verify exact backend checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            source/desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
        with: {toolchain: '1.96.0', components: rustfmt}
      - name: Validate backend workflow contracts
        run: node --test .github/scripts/tests/backend-preflight.test.mjs
      - name: Install locked backend source dependencies
        working-directory: source
        run: node ../.github/scripts/ci-task.mjs root-dependencies npm ci
      - name: Install locked frontend contract dependencies
        working-directory: source/desktop-tauri
        run: node ../../.github/scripts/ci-task.mjs tauri-frontend-dependencies npm ci --ignore-scripts
      - name: Reproduce reviewed native patch before gateway compilation
        run: node .github/scripts/ci-task.mjs native-source node .github/scripts/prepare-source.mjs
      - name: Build TypeScript and run source contracts
        working-directory: source
        run: node ../.github/scripts/ci-task.mjs root-contracts npm test
      - name: Restore private gateway validation dependencies
        continue-on-error: true
        timeout-minutes: 15
        env: {GH_TOKEN: '${{ secrets.CODEFERRY_SOURCE_TOKEN }}'}
        run: node .github/scripts/private-cache.mjs restore validate-linux-x64
      - name: Require named PostgreSQL and Redis tests to actually execute
        working-directory: source
        run: node ../.github/scripts/ci-task.mjs gateway-contracts node scripts/backend-acceptance.mjs
      - name: Preserve failed backend diagnostics privately
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.CODEFERRY_SOURCE_TOKEN }}
          CODEFERRY_DIAGNOSTIC_ROLE: validate
        run: node .github/scripts/save-private-diagnostics.mjs
      - name: Save reusable gateway validation dependencies privately
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.CODEFERRY_SOURCE_TOKEN }}
          CODEFERRY_CACHE_COMPLETE: ${{ job.status == 'success' }}
        run: node .github/scripts/private-cache.mjs save validate-linux-x64
