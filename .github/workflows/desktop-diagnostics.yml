name: Private desktop preflight

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact private source commit to compile without publishing
        required: true
        type: string

      platform:
        description: Platform to diagnose without publishing
        required: true
        default: all
        type: choice
        options: [all, win32]

permissions:
  contents: read
concurrency:
  group: codeferry-desktop-preflight
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  preflight:
    name: Compile and diagnose ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'win32' && '[{"os":"windows-2025","platform":"win32","arch":"x64"}]' || '[{"os":"macos-15","platform":"darwin","arch":"arm64"},{"os":"windows-2025","platform":"win32","arch":"x64"},{"os":"ubuntu-24.04","platform":"linux","arch":"x64"}]') }}
    env:
      SOURCE_SHA: ${{ inputs.source_commit }}
    steps:
      - name: Validate exact source commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'SOURCE_COMMIT_MUST_BE_EXACT_SHA'; exit 1; }
          git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: crazylin/codeferry
          ref: ${{ inputs.source_commit }}
          token: ${{ secrets.CODEFERRY_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            source/desktop-tauri/package-lock.json
      - name: Validate private Windows diagnostic identity and redaction
        if: runner.os == 'Windows'
        run: node --test .github/scripts/tests/windows-diagnostics.test.mjs .github/scripts/tests/private-diagnostics.test.mjs
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
        with: {toolchain: '1.96.0', components: rustfmt}
      - name: Prepare reviewed native source
        run: node .github/scripts/ci-task.mjs native-source node .github/scripts/prepare-source.mjs
      - name: Restore private desktop Rust dependencies
        env: {GH_TOKEN: '${{ secrets.CODEFERRY_SOURCE_TOKEN }}'}
        run: node .github/scripts/private-cache.mjs restore desktop-${{ matrix.platform }}-${{ matrix.arch }}
      - name: Build real Windows Runner from reviewed source
        if: runner.os == 'Windows'
        working-directory: source
        env:
          CODEFERRY_NATIVE_PROFILE: release
        run: node ../.github/scripts/ci-task.mjs native-runtime node scripts/native-build.mjs
      - name: Install Linux native WebView build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev
      - name: Install locked frontend dependencies
        working-directory: source/desktop-tauri
        run: node ../../.github/scripts/ci-task.mjs tauri-dependencies npm ci
      - name: Build frontend and compile complete Rust client tests
        shell: bash
        working-directory: source/desktop-tauri
        env:
          # Execute the real Linux kernel namespace proof; missing bwrap is a CI failure.
          CODEFERRY_REQUIRE_BWRAP: ${{ runner.os == 'Linux' && '1' || '0' }}
          # Windows Job Object cancellation must be proven on a real kernel.
          CODEFERRY_REQUIRE_WINDOWS_MCP_JOB: ${{ runner.os == 'Windows' && '1' || '0' }}
          CODEFERRY_TEST_RUNNER: ${{ github.workspace }}/source/runtime/codeferry-runner.exe
          CODEFERRY_RUNNER_TEST_EXE: ${{ github.workspace }}/source/runtime/codeferry-runner.exe
          CODEFERRY_BROKER_TEST_EXE: ${{ github.workspace }}/source/desktop-tauri/src-tauri/target/debug/codeferry-windows-broker.exe
        run: |
          set -euo pipefail
          node ../../.github/scripts/ci-task.mjs tauri-types npm run typecheck
          node ../../.github/scripts/ci-task.mjs tauri-frontend-build npm run build
          if [ "$RUNNER_OS" = "Windows" ]; then
            node ../../.github/scripts/ci-task.mjs windows-broker cargo build --locked --manifest-path src-tauri/Cargo.toml --bin codeferry-windows-broker
            # Run exact kernel proofs before the broad Rust suite so a
            # blocked Workspace Write boundary has its own non-secret label.
            # These tests cannot authorize production workspace-write.
            test -f "$CODEFERRY_RUNNER_TEST_EXE"
            test -f "$CODEFERRY_BROKER_TEST_EXE"
            node ../../.github/scripts/ci-task.mjs windows-real-runner-appcontainer node ../../.github/scripts/require-windows-real-runner.mjs
          fi
          node ../../.github/scripts/ci-task.mjs tauri-contracts cargo test --manifest-path src-tauri/Cargo.toml --locked --no-run
          node ../../.github/scripts/ci-task.mjs tauri-contracts cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Test macOS native browser isolation and management IPC
        if: runner.os == 'macOS'
        working-directory: source/desktop-tauri
        run: node ../../.github/scripts/ci-task.mjs tauri-native-browser npm run test:browser
      - name: Retain bounded pre-signing failure diagnostics privately
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.CODEFERRY_SOURCE_TOKEN }}
          CODEFERRY_DIAGNOSTIC_ROLE: ${{ matrix.platform }}-${{ matrix.arch }}
        run: node .github/scripts/save-private-diagnostics.mjs
      - name: Save reusable dependencies privately even after a failed preflight
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.CODEFERRY_SOURCE_TOKEN }}
          CODEFERRY_CACHE_COMPLETE: 'false'
        run: node .github/scripts/private-cache.mjs save desktop-${{ matrix.platform }}-${{ matrix.arch }}
