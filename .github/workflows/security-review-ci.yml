# Isolated CI for an immutable source review commit. No release/publish/deploy jobs.
name: Security review CI (codeferry-build)

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character security review source commit
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: codeferry-security-review-${{ inputs.source_commit }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  resolve:
    name: Resolve one immutable private source commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate requested commit
        shell: bash
        env:
          REQUESTED_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          if ! [[ "$REQUESTED_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'SOURCE_COMMIT_MUST_BE_EXACT_SHA'; exit 1
          fi
          git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: crazylin/codeferry
          ref: ${{ inputs.source_commit }}
          token: ${{ secrets.CODEFERRY_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
      - id: source
        name: Verify immutable source identity
        shell: bash
        env:
          REQUESTED_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          sha="$(git -C source rev-parse HEAD)"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          git -C source cat-file -e "${sha}^{commit}"
          if [ "$sha" != "$REQUESTED_COMMIT" ]; then exit 1; fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          echo 'IMMUTABLE_SOURCE_RESOLVED'

  validate:
    name: Contracts and real PostgreSQL Redis validation
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      TEST_DATABASE_URL: postgres://codeferry:fixture-ci-password@127.0.0.1:5432/codeferry
      TEST_REDIS_URL: redis://127.0.0.1:6379
    services:
      postgres:
        image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: codeferry
          POSTGRES_PASSWORD: fixture-ci-password
          POSTGRES_DB: codeferry
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U codeferry -d codeferry"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: crazylin/codeferry
          ref: ${{ needs.resolve.outputs.source_sha }}
          token: ${{ secrets.CODEFERRY_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            source/desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
        with: {toolchain: '1.96.0', components: rustfmt}
      - name: Validate workflow publishing contracts
        run: node --test .github/scripts/tests/*.test.mjs
      - name: Install locked source dependencies
        working-directory: source
        run: node ../.github/scripts/ci-task.mjs root-dependencies npm ci
      - name: Install locked Tauri frontend dependencies
        working-directory: source/desktop-tauri
        run: node ../../.github/scripts/ci-task.mjs tauri-frontend-dependencies npm ci
      - name: Reproduce reviewed native patch before any Cargo build
        run: node .github/scripts/ci-task.mjs native-source node .github/scripts/prepare-source.mjs
      - name: Test TypeScript contracts
        working-directory: source
        run: node ../.github/scripts/ci-task.mjs root-contracts npm test
      - name: Check and bundle the current Tauri frontend
        working-directory: source/desktop-tauri
        run: |
          node ../../.github/scripts/ci-task.mjs tauri-frontend-types npm run typecheck
          node ../../.github/scripts/ci-task.mjs tauri-frontend-build npm run build
          node ../../.github/scripts/ci-task.mjs tauri-ui npm run test:ui
      - name: Restore private validation Rust dependencies
        continue-on-error: true
        timeout-minutes: 30
        env: {GH_TOKEN: '${{ secrets.CODEFERRY_SOURCE_TOKEN }}'}
        run: node .github/scripts/private-cache.mjs restore validate-linux-x64
      - name: Validate local fingerprint scoring parity
        working-directory: source
        run: node ../.github/scripts/ci-task.mjs fingerprint-contracts cargo test --locked --manifest-path crates/codeferry-fingerprint/Cargo.toml
      - name: Validate native formatting and authorization
        working-directory: source/upstream/webcodex
        run: |
          node ../../../.github/scripts/ci-task.mjs native-format cargo fmt --all --check
          node ../../../.github/scripts/ci-task.mjs native-auth cargo test --locked -p webcodex --lib auth::
          node ../../../.github/scripts/ci-task.mjs native-embedding cargo test --locked -p webcodex --lib embedded
          node ../../../.github/scripts/ci-task.mjs native-drain cargo test --locked -p webcodex --lib server_shutdown
      - name: Test gateway with real isolated PostgreSQL and Redis
        working-directory: source
        run: node ../.github/scripts/ci-task.mjs gateway-contracts cargo test --manifest-path gateway-rs/Cargo.toml --locked -- --include-ignored --test-threads=1
      - name: Test host update worker migration and identity contracts
        working-directory: source
        run: node ../.github/scripts/ci-task.mjs gateway-worker python3 -m unittest discover -s scripts/test -p release_worker_test.py
  desktop-linux-landlock:
    name: Linux Landlock Runner sandbox acceptance (no publication)
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      CODEFERRY_REQUIRE_LANDLOCK: '1'
    steps:
      - name: Verify Linux kernel sandbox capability
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          test "$(uname -s)" = Linux
          git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: crazylin/codeferry
          ref: ${{ needs.resolve.outputs.source_sha }}
          token: ${{ secrets.CODEFERRY_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
      - name: Verify pinned source identity
        run: test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.13.1'}
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
        with: {toolchain: '1.96.0', components: rustfmt}
      - name: Install native GTK and WebKit development dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf pkg-config
      - name: Install locked dependencies and verify native source baseline
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix source ci
          node .github/scripts/ci-task.mjs native-source node .github/scripts/prepare-source.mjs
      - name: Build trusted Tauri frontend required by the desktop Rust macros
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix source/desktop-tauri ci --ignore-scripts
          npm --prefix source/desktop-tauri run build
      - name: Run actual Linux Landlock process and child write-denial tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node ../.github/scripts/ci-task.mjs linux-landlock cargo test --locked --manifest-path desktop-tauri/src-tauri/Cargo.toml runner::sandbox -- --test-threads=1

  desktop-macos:
    name: macOS native desktop review (no publication)
    needs: resolve
    runs-on: macos-15
    timeout-minutes: 100
    env:
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
    steps:
      - name: Require actual macOS arm64
        shell: bash
        run: |
          set -euo pipefail
          node -e "if(process.platform !== 'darwin' || process.arch !== 'arm64')throw Error('MACOS_ARM64_REQUIRED')"
          git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: crazylin/codeferry
          ref: ${{ needs.resolve.outputs.source_sha }}
          token: ${{ secrets.CODEFERRY_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
      - name: Verify immutable source checkout
        shell: bash
        run: test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            source/desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
        with: {toolchain: '1.96.0', components: rustfmt}
      - name: Install locked dependencies
        run: |
          npm --prefix source ci
          npm --prefix source/desktop-tauri ci --ignore-scripts
      - name: Verify native baseline and exact source patch
        run: node .github/scripts/ci-task.mjs native-source node .github/scripts/prepare-source.mjs
      - name: Verify native MCP guard hard-kill reaps provider and descendants
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node ../.github/scripts/ci-task.mjs native-guard-build cargo build --locked --profile dogfood --manifest-path upstream/webcodex/Cargo.toml -p webcodex-runner --bin codeferry-runner
          CODEFERRY_GUARD_RUNNER_BIN="$PWD/upstream/webcodex/target/dogfood/codeferry-runner" node ../.github/scripts/ci-task.mjs native-guard-process-tree python3 desktop-tauri/scripts/runner_guard_fixture.py
      - name: Verify Tauri application build
        working-directory: source/desktop-tauri
        run: |
          node ../../.github/scripts/ci-task.mjs tauri-typecheck npm run typecheck
          node ../../.github/scripts/ci-task.mjs tauri-build npm run build
          node ../../.github/scripts/ci-task.mjs tauri-ui npm run test:ui
          node ../../.github/scripts/ci-task.mjs tauri-rust cargo test --locked --manifest-path src-tauri/Cargo.toml

  desktop-windows-guard:
    name: Windows native desktop fail-closed and process-tree acceptance (no publication)
    needs: resolve
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact LF bytes before all Windows Git checkouts
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_GIT_EOL_SETUP_FAILED' }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: crazylin/codeferry
          ref: ${{ needs.resolve.outputs.source_sha }}
          token: ${{ secrets.CODEFERRY_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
      - name: Verify exact private source commit
        run: |
          if ((git -C source rev-parse HEAD).Trim() -ne $env:SOURCE_SHA) { throw 'WINDOWS_SOURCE_SHA_MISMATCH' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.13.1'}
      - name: Use pinned Windows Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'RUSTUP_TOOLCHAIN_INSTALL_FAILED' }
          rustup default 1.96.0
          if ($LASTEXITCODE -ne 0) { throw 'RUSTUP_DEFAULT_FAILED' }
          rustc --version
          if ($LASTEXITCODE -ne 0) { throw 'RUSTC_UNAVAILABLE' }
      - name: Install locked dependencies and verify exact native source patch
        run: |
          npm --prefix source ci
          if ($LASTEXITCODE -ne 0) { throw 'SOURCE_NPM_CI_FAILED' }
          node .github/scripts/prepare-source.mjs
          if ($LASTEXITCODE -ne 0) { throw 'NATIVE_SOURCE_PREPARE_FAILED' }
          npm --prefix source/desktop-tauri ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'TAURI_NPM_CI_FAILED' }
      - name: Build trusted Tauri frontend
        run: |
          npm --prefix source/desktop-tauri run build
          if ($LASTEXITCODE -ne 0) { throw 'TAURI_FRONTEND_BUILD_FAILED' }
      - name: Verify Windows Workspace Write explicitly fails closed
        run: |
          cargo test --locked --manifest-path source/desktop-tauri/src-tauri/Cargo.toml windows_workspace_write_never_downgrades_to_full_access -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_WORKSPACE_FAIL_CLOSED_FAILED' }
      - name: Verify Runner Windows Job Object never permits silent breakaway
        run: |
          cargo test --locked --manifest-path source/desktop-tauri/src-tauri/Cargo.toml windows_runner_job_object_disallows_silent_child_breakaway -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_RUNNER_JOB_OWNERSHIP_FAILED' }
      - name: Prove Windows native AppContainer filesystem boundary (test-only, no Runner enablement)
        run: |
          cargo test --locked --manifest-path source/desktop-tauri/src-tauri/Cargo.toml windows_appcontainer_kernel_blocks_ungranted_writes -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_APPCONTAINER_NATIVE_BOUNDARY_FAILED' }
      - name: Prove Windows AppContainer audited stdin stdout pipe whitelist (test-only)
        run: |
          cargo test --locked --manifest-path source/desktop-tauri/src-tauri/Cargo.toml windows_appcontainer_pipes_restrict_inherited_handles -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_APPCONTAINER_PIPE_WHITELIST_FAILED' }
      - name: Prove Windows AppContainer scoped inheritance and concurrent handle exclusion
        run: |
          cargo test --locked --manifest-path source/desktop-tauri/src-tauri/Cargo.toml windows_appcontainer_scoped_pipe_handles_restore -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_APPCONTAINER_INHERIT_SCOPE_FAILED' }
          cargo test --locked --manifest-path source/desktop-tauri/src-tauri/Cargo.toml windows_appcontainer_rejects_unlisted_inheritable_host_file -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_APPCONTAINER_UNLISTED_HOST_HANDLE_LEAK' }
          cargo test --locked --manifest-path source/desktop-tauri/src-tauri/Cargo.toml windows_appcontainer_concurrent_stdio_isolated -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_APPCONTAINER_CONCURRENT_PIPES_FAILED' }
      - name: Attest suspended AppContainer kernel token and exact package SID
        run: |
          cargo test --locked --manifest-path source/desktop-tauri/src-tauri/Cargo.toml windows_appcontainer_attests_real_token_sid_before_resume -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_APPCONTAINER_TOKEN_ATTESTATION_FAILED' }
      - name: Verify AppContainer NTFS junction hardlink ADS escape denial (real Windows)
        run: |
          cargo test --locked --manifest-path source/desktop-tauri/src-tauri/Cargo.toml windows_appcontainer_ntfs_alias_and_ads_do_not_escape_granted_acl -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_APPCONTAINER_NTFS_ALIAS_ESCAPE_FAILED' }
      - name: Prove independently hosted Windows Broker no-handle-inherit and sanitized environment
        run: |
          cargo test --locked --manifest-path source/desktop-tauri/src-tauri/Cargo.toml windows_isolated_broker_no_host_handles_or_ambient_env -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_BROKER_OS_PROCESS_ISOLATION_FAILED' }
      - name: Native standalone Broker executable protocol and denial acceptance (no publication)
        run: |
          cargo test --locked --manifest-path source/desktop-tauri/src-tauri/Cargo.toml --bin codeferry-windows-broker -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_BROKER_PROTOCOL_UNIT_TEST_FAILED' }
          cargo build --locked --manifest-path source/desktop-tauri/src-tauri/Cargo.toml --bin codeferry-windows-broker
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_BROKER_EXECUTABLE_BUILD_FAILED' }
          $env:CODEFERRY_BROKER_TEST_EXE = (Resolve-Path 'source/desktop-tauri/src-tauri/target/debug/codeferry-windows-broker.exe').Path
          cargo test --locked --manifest-path source/desktop-tauri/src-tauri/Cargo.toml windows_broker_executable_rejects_execution_requests -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_BROKER_EXECUTABLE_FAIL_CLOSED_FAILED' }
          cargo test --locked --manifest-path source/desktop-tauri/src-tauri/Cargo.toml windows_broker_executable_native_handle_allowlist_and_job -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_BROKER_NATIVE_HANDLE_LIST_JOB_FAILED' }
          cargo test --locked --manifest-path source/desktop-tauri/src-tauri/Cargo.toml windows_production_broker_bootstrap_hash_and_denial -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_PRODUCTION_BROKER_BOOTSTRAP_FAILED' }
          cargo test --locked --manifest-path source/desktop-tauri/src-tauri/Cargo.toml windows_real_broker_appcontainer_child_is_job_owned_and_denies_runner -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_REAL_BROKER_APPCONTAINER_CHILD_FAILED' }
          cargo test --locked --manifest-path source/desktop-tauri/src-tauri/Cargo.toml windows_broker_executable_deadlines_stalled_and_partial_frames -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_BROKER_STALLED_FRAME_DEADLINE_FAILED' }
          cargo test --locked --manifest-path source/desktop-tauri/src-tauri/Cargo.toml windows_broker_executable_one_shot_replay_and_cross_session_denial -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_BROKER_ONE_SHOT_REPLAY_DENIAL_FAILED' }
      - name: Verify real Windows process tree containment
        run: |
          cargo test --locked --manifest-path source/upstream/webcodex/Cargo.toml -p webcodex-process --test managed_child explicit_terminate_kills_tree -- --include-ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_JOB_TERMINATION_FAILED' }
          cargo test --locked --manifest-path source/upstream/webcodex/Cargo.toml -p webcodex-process --test managed_child drop_kills_tree -- --include-ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_JOB_DROP_FAILED' }
